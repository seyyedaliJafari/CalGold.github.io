<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>محاسبه‌گر طلای ۱۸ عیار</title>
    <link rel="icon" type="image/png" href="https://fs.noorgram.ir/xen/2021/05/1937_a04f325674750b15e1a00d49222b587f.png" />
    <link rel="manifest" href="manifest.json" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(160deg, #1a1a1a, #333, #ffd700, #ffecb3);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
            color: #fff;
            gap: 30px; /* فاصله بین دو کارت */
        }

        .card {
            max-width: 500px;
            width: 100%;
            background: rgba(20, 20, 20, 0.95);
            padding: 50px 30px;
            border-radius: 30px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.35), 0 0 20px rgba(255,215,0,0.3);
            transition: all 0.4s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 70px rgba(0,0,0,0.4), 0 0 25px rgba(255,215,0,0.5);
        }

        h1 {
            font-size: 32px;
            color: #ffd700;
            margin-bottom: 16px;
            text-shadow: 0 0 8px #ffd700;
        }

        p {
            font-size: 17px;
            color: #eee;
            margin-bottom: 30px;
            line-height: 1.7;
        }

        .btn-enter {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ffd700, #ffecb3);
            color: #1a1a1a;
            font-weight: 700;
            font-size: 18px;
            border-radius: 22px;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(255,215,0,0.4);
            transition: all 0.3s;
        }

        .btn-enter:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 25px rgba(255,215,0,0.6);
        }

        #installBtn {
            display: none;
            width: 90%;
            max-width: 480px;
            padding: 18px;
            background: #ffd700;
            color: #1a1a1a;
            border: none;
            border-radius: 22px;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,215,0,0.4);
            margin-top: 20px;
        }

        #installBtn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 25px rgba(255,215,0,0.6);
        }

        @media (max-width: 520px) {
            .card { padding: 40px 25px; }
            h1 { font-size: 28px; }
            p { font-size: 16px; }
        }
    </style>
</head>
<body>

<!-- کارت طلای نو -->
<div class="card">
    <h1>محاسبه‌گر طلای نو</h1>
    <p>قیمت دقیق طلا با سود، اجرت و مالیات — فقط در چند ثانیه</p>
    <a href="cal.html" class="btn-enter">ورود به محاسبه‌گر</a>
</div>

<!-- کارت طلای مستعمل -->
<div class="card">
    <h1>محاسبه‌گر طلای مستعمل</h1>
    <p>محاسبه قیمت خرید طلا با کسر کارمزد و مالیات</p>
    <a href="cal2.html" class="btn-enter">ورود به محاسبه‌گر</a>
</div>

<button id="installBtn">افزودن به صفحه اصلی</button>

<script>
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') console.log('نصب شد');
            deferredPrompt = null;
            installBtn.style.display = 'none';
        }
    });
</script>

</body>
</html>
