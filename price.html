<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خروجی سرور</title>
<style>
body {
    font-family: sans-serif;
    background: #1a1a1a;
    color: #ffd700;
    padding: 20px;
    line-height: 1.6;
    white-space: pre-wrap; /* نمایش خط به خط */
}
</style>
</head>
<body>

<h2>خروجی سرور:</h2>
<pre id="output">در حال بارگذاری...</pre>

<script>
const url = "https://cors-anywhere.com/https://getprice.infinityfreeapp.com/index.php";

fetch(url, {
    headers: {
        "X-Requested-With": "XMLHttpRequest"
    }
})
.then(res => res.text()) // توجه: اینجا text می‌گیریم نه json
.then(text => {
    document.getElementById('output').textContent = text;
})
.catch(err => {
    document.getElementById('output').textContent = "خطا در دریافت داده:\n" + err;
    console.error(err);
});
</script>

</body>
</html>
